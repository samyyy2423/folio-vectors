name: test

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # the newest Folio, from its releases
      - name: Get Folio
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o folio.exe https://github.com/samyyy2423/folio/releases/latest/download/folio-windows.exe
          else
            curl -fsSL -o folio https://github.com/samyyy2423/folio/releases/latest/download/folio-linux
            chmod +x folio
          fi
      - name: Test
        shell: bash
        run: ./folio test --allow-read --allow-write vectors.test.folio
      - name: Tidy
        shell: bash
        run: ./folio tidy --check vectors.folio vectors.test.folio
